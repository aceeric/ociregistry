name: Server

# Called by release.yml on a version tag. Can also be run by hand.
on:
  workflow_dispatch:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Test
        shell: bash
        run: |
          make test

  publish_server:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Check out
        uses: actions/checkout@v6

      - name: Set up QEMU for Buildx Multi-Platform
        uses: docker/setup-qemu-action@v4

      - name: Login to Quay
        uses: docker/login-action@v4
        with:
          registry: quay.io
          username: ${{ vars.QUAY_CI_ACCOUNT }}
          password: ${{ secrets.QUAY_ROBOT_TOKEN }}

      - name: Build and push the server image
        shell: bash
        run: |
          make image SERVER_VERSION=${{ github.ref_name }}

      - name: Save the server image as an OCI archive
        shell: bash
        run: |
          make image-archive SERVER_VERSION=${{ github.ref_name }}

      - name: Upload the image archive
        uses: actions/upload-artifact@v7
        with:
          name: image-archive
          path: dist/*.oci.tar
          if-no-files-found: error
          retention-days: 3
